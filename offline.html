<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d24">
  <meta name="robots" content="noindex">
  <title>Sin conexión | Agenda FTF</title>
  <style>
    :root { color-scheme: light; --ink: #101d24; --green: #26983c; --paper: #f7f9fa; --line: #dce3e6; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 80% 10%, #e8f5ea, transparent 34%), linear-gradient(135deg, #eef5fa, var(--paper) 58%); color: var(--ink); font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(480px, 100%); overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: #fff; box-shadow: 0 24px 70px rgb(16 29 36 / 12%); }
    .brand { padding: 28px; background: var(--ink); }
    .brand img { display: block; width: 96px; height: 96px; border-radius: 18px; }
    .copy { padding: 32px 28px 30px; }
    .eyebrow { margin: 0 0 8px; color: #64747c; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 8vw, 44px); line-height: 1.05; letter-spacing: -.035em; }
    p { margin: 16px 0 26px; color: #596970; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: var(--green); color: #fff; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 8px 22px rgb(38 152 60 / 20%); }
    button:focus-visible { outline: 3px solid rgb(38 152 60 / 30%); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="icons/icon-192.png" alt="Felix Trujillo Falla"></div>
    <section class="copy">
      <p class="eyebrow">Agenda inmobiliaria</p>
      <h1>Sin conexión</h1>
      <p>La agenda necesita internet para proteger y mantener actualizadas las citas del equipo. Revisa tu conexión e intenta nuevamente.</p>
      <button type="button" onclick="window.location.reload()">Volver a intentar</button>
    </section>
  </main>
</body>
</html>
